name: desktop builds
on:
  workflow_dispatch:
  push:
    branches: [draft]
    paths:
      - 'app.py'
      - 'intellicage/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/desktop.yml'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install poetry==2.5.1
      - run: poetry sync --only main,build --all-extras
      - run: poetry run nicegui-pack --name "intellicage analysis" --onedir --windowed --noconfirm app.py
      - name: check mac executable
        if: runner.os == 'macOS'
        run: '"dist/intellicage analysis/intellicage analysis" --help'
      - name: check windows executable
        if: runner.os == 'Windows'
        run: |
          & ".\dist\intellicage analysis\intellicage analysis.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: archive mac app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/intellicage analysis.app' dist/intellicage-analysis-macOS.zip
      - name: archive windows app
        if: runner.os == 'Windows'
        run: Compress-Archive -Path 'dist/intellicage analysis' -DestinationPath dist/intellicage-analysis-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: intellicage-analysis-${{ matrix.os }}
          path: dist/intellicage-analysis-*.zip
          if-no-files-found: error
