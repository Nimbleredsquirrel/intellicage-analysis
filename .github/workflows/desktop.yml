name: desktop builds
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install poetry==2.5.1
      - run: poetry sync --only main,build --all-extras
      - run: poetry run nicegui-pack --name IntelliCage --onedir --windowed app.py
      - uses: actions/upload-artifact@v4
        with:
          name: IntelliCage-${{ matrix.os }}
          path: dist/
