name: desktop builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options:
          - all
          - Windows
          - macOS-Apple-Silicon
          - macOS-Intel
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.platform == 'all' && '["macOS-Apple-Silicon","macOS-Intel","Windows"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ fromJSON('{"macOS-Apple-Silicon":"macos-15","macOS-Intel":"macos-15-intel","Windows":"windows-latest"}')[matrix.package] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install poetry==2.5.1
      - run: poetry sync --with dev,build --all-extras
      - run: poetry run pytest --cov --cov-report=term-missing
      - name: install a browser for export checks
        shell: python
        run: |
          import os, subprocess
          script = "import os; from pathlib import Path; import plotly.io as pio; root = Path(os.environ['RUNNER_TEMP']) / 'intellicage-chrome'; root.mkdir(exist_ok=True); print(pio.get_chrome(path=root))"
          browser = subprocess.check_output(['poetry', 'run', 'python', '-c', script], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf8') as output:
              output.write(f'BROWSER_PATH={browser}\n')
      - name: package mac app
        if: runner.os == 'macOS'
        run: poetry run nicegui-pack --name "intellicage analysis" --onedir --windowed --clean --noconfirm app.py
      - name: bundle the microsoft window installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP 'intellicage-bootstrap'
          New-Item -ItemType Directory -Force $bootstrap | Out-Null
          $installer = Join-Path $bootstrap 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'The WebView2 installer does not have a valid Microsoft signature'
          }
          $available = poetry run python -c "from intellicage.windows_startup import webview_version; print('ready' if webview_version() else 'missing')"
          if ($available -ne 'ready') {
            $setup = Start-Process -FilePath (Resolve-Path $installer) -ArgumentList '/silent', '/install' -Wait -PassThru
            $available = poetry run python -c "from intellicage.windows_startup import webview_version; print('ready' if webview_version() else 'missing')"
            if ($available -ne 'ready') { throw "WebView2 setup failed: $($setup.ExitCode)" }
          }
      - name: package windows app
        if: runner.os == 'Windows'
        run: poetry run nicegui-pack --name "intellicage analysis" --onedir --windowed --clean --noconfirm --add-data "${{ runner.temp }}/intellicage-bootstrap/MicrosoftEdgeWebview2Setup.exe;bootstrap" app.py
      - name: archive mac app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/intellicage analysis.app' 'dist/intellicage-analysis-${{ matrix.package }}.zip'
      - name: archive windows app
        if: runner.os == 'Windows'
        run: Compress-Archive -Path 'dist/intellicage analysis' -DestinationPath dist/intellicage-analysis-Windows.zip
      - name: check the unpacked desktop app
        shell: python
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          import ctypes, json, os, shutil, subprocess, sys, tempfile, time, zipfile
          from pathlib import Path
          sys.stdout.reconfigure(encoding='utf8', errors='replace')
          sys.stderr.reconfigure(encoding='utf8', errors='replace')
          archive = Path('dist') / f"intellicage-analysis-{os.environ['PACKAGE']}.zip"
          results = Path(os.environ['RUNNER_TEMP']) / 'intellicage-check-results'
          with tempfile.TemporaryDirectory(prefix='intellicage-check-') as temporary:
              folder = Path(temporary) / 'проверка программы'
              folder.mkdir()
              if os.name == 'nt':
                  with zipfile.ZipFile(archive) as packed:
                      packed.extractall(folder)
                  executable = folder / 'intellicage analysis' / 'intellicage analysis.exe'
                  # match explorer extraction of a downloaded zip
                  bundle = executable.parent / '_internal'
                  tagged = []
                  for path in bundle.rglob('*.dll'):
                      Path(f'{path}:Zone.Identifier').write_text('[ZoneTransfer]\nZoneId=3\n', encoding='ascii')
                      tagged.append(path)
                  assert tagged, 'No bundled DLLs found for the downloaded-file check'
                  print(f'Added internet download marks to {len(tagged)} bundled DLLs')
                  probe = subprocess.run(['poetry', 'run', 'python', '-c',
                      'import sys; from clr_loader import get_netfx; '
                      'get_netfx().get_assembly(sys.argv[1]).get_function("Python.Runtime.Loader.Initialize")',
                      str(bundle / 'pythonnet/runtime/Python.Runtime.dll')],
                      capture_output=True, text=True, timeout=30)
                  assert probe.returncode and 'Failed to resolve Python.Runtime.Loader.Initialize' in probe.stderr, probe.stderr
                  print('Reproduced the .NET loader failure before preparing downloaded DLLs')
              else:
                  subprocess.run(['ditto', '-x', '-k', str(archive.resolve()), str(folder)], check=True)
                  executable = folder / 'intellicage analysis.app/Contents/MacOS/intellicage analysis'
              environment = dict(os.environ)
              for key in ('PYTHONPATH', 'PYTHONHOME', 'VIRTUAL_ENV'):
                  environment.pop(key, None)
              environment['PATH'] = str(Path(os.environ['SystemRoot']) / 'System32') if os.name == 'nt' else '/usr/bin:/bin:/usr/sbin:/sbin'
              process = None
              try:
                  process = subprocess.run([str(executable), '--check-exports', str(results)],
                                           cwd=folder, env=environment, timeout=240)
                  error = results / 'error.txt'
                  if error.exists():
                      print(error.read_text(encoding='utf8'))
                  process.check_returncode()
                  if os.name == 'nt':
                      runtime = bundle / 'pythonnet/runtime/Python.Runtime.dll'
                      assert runtime.is_file(), 'The Python/.NET bridge is missing from the package'
                      try:
                          Path(f'{runtime}:Zone.Identifier').read_bytes()
                      except FileNotFoundError:
                          pass
                      else:
                          raise AssertionError('The bundled assembly is still blocked')
                  assert json.loads((results / 'check.json').read_text()) == {'ok': True}
                  print('Desktop exports verified: PNG, SVG, dashboard PDF, CSV, TXT, XLSX; Welch, mixed ANOVA and LMM checked')
                  process = subprocess.Popen([str(executable), '--check-window', str(results)],
                                             cwd=folder, env=environment)
                  marker = results / 'window-check.json'
                  deadline = time.monotonic() + 240
                  while not marker.exists():
                      if process.poll() is not None:
                          raise RuntimeError(f'The desktop window exited early: {process.returncode}')
                      if time.monotonic() > deadline:
                          raise TimeoutError('The desktop window did not become ready')
                      time.sleep(.2)
                  report = json.loads(marker.read_text(encoding='utf8'))
                  assert report['shown'] and report['connected'] and report['ready']
                  assert report['title'] == 'intellicage analysis'
                  if os.name == 'nt':
                      duplicate = subprocess.run([str(executable)], cwd=folder, env=environment, timeout=45)
                      duplicate.check_returncode()
                      assert process.poll() is None, 'A duplicate launch closed the original window'
                      from ctypes import wintypes
                      user32 = ctypes.windll.user32
                      user32.FindWindowW.restype = wintypes.HWND
                      user32.FindWindowW.argtypes = [wintypes.LPCWSTR, wintypes.LPCWSTR]
                      user32.IsWindowVisible.argtypes = [wintypes.HWND]
                      user32.PostMessageW.argtypes = [wintypes.HWND, wintypes.UINT, wintypes.WPARAM, wintypes.LPARAM]
                      window = user32.FindWindowW(None, 'intellicage analysis')
                      assert window and user32.IsWindowVisible(window), 'The desktop window is not visible'
                      assert user32.PostMessageW(window, 0x0010, 0, 0), 'The desktop window could not be closed'
                      assert process.wait(timeout=30) == 0
                      print('Native Windows window opened, loaded its interface, handled a duplicate launch and closed')
                      process = subprocess.Popen([str(executable), '--check-error-dialog', str(results)],
                                                 cwd=folder, env=environment)
                      deadline = time.monotonic() + 45
                      dialog = None
                      while not dialog:
                          dialog = user32.FindWindowW('#32770', 'intellicage analysis')
                          if process.poll() is not None or time.monotonic() > deadline:
                              raise RuntimeError('The startup error dialog did not open')
                          time.sleep(.1)
                      # taskdialog uses directui controls, not ordinary button hwnds
                      assert user32.PostMessageW(dialog, 0x0466, 100, 0)
                      assert process.wait(timeout=30) == 0
                      user32.GetClipboardData.argtypes = [wintypes.UINT]
                      user32.GetClipboardData.restype = wintypes.HANDLE
                      kernel = ctypes.windll.kernel32
                      kernel.GlobalLock.argtypes = [wintypes.HANDLE]
                      kernel.GlobalLock.restype = wintypes.LPVOID
                      kernel.GlobalUnlock.argtypes = [wintypes.HANDLE]
                      assert user32.OpenClipboard(None)
                      try:
                          memory = user32.GetClipboardData(13)
                          assert memory
                          pointer = kernel.GlobalLock(memory)
                          assert pointer
                          try:
                              copied = ctypes.wstring_at(pointer)
                          finally:
                              kernel.GlobalUnlock(memory)
                      finally:
                          user32.CloseClipboard()
                      assert 'RuntimeError: startup diagnostic check · мышь' in copied
                      assert 'Traceback' in copied and 'Python:' in copied and 'OS:' in copied
                      assert (results / 'error-dialog-closed.txt').read_text() == 'ok'
                      print('Startup error dialog copied a full Unicode error report without the desktop engine')
                  else:
                      process.terminate()
                      process.wait(timeout=30)
                      print('Native macOS window opened and loaded its interface; app terminated')
              finally:
                  if os.name == 'nt':
                      subprocess.run(['taskkill', '/F', '/T', '/IM', 'intellicage analysis.exe'],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  elif isinstance(process, subprocess.Popen) and process.poll() is None:
                      process.kill()
                      process.wait(timeout=10)
                  log_root = Path(os.environ['LOCALAPPDATA']) if os.name == 'nt' else Path(tempfile.gettempdir())
                  log = log_root / 'intellicage analysis/logs/startup.log'
                  results.mkdir(exist_ok=True)
                  if log.exists():
                      shutil.copy2(log, results / 'startup.log')
                      print(log.read_text(encoding='utf8', errors='replace')[-12000:])
      - name: save export check files
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.package }}
          path: ${{ runner.temp }}/intellicage-check-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          path: dist/intellicage-analysis-${{ matrix.package }}.zip
          archive: false
          if-no-files-found: error
