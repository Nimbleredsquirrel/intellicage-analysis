name: checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install poetry==2.5.1
      - run: poetry sync --with dev --all-extras
      - run: poetry run pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml
